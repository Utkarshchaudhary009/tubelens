name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Swap AGENTS.md identity
        run: cp AGENTS.md /tmp/AGENTS.orig.md && cp AGENTS.E2E.md AGENTS.md

      - name: Start dev server and wait healthy
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "dev server healthy"
              exit 0
            fi
            sleep 2
          done
          echo "dev server never became healthy"
          cat /tmp/dev.log
          exit 1

      - name: Run E2E bot (non-interactive, no TUI)
        id: e2e
        continue-on-error: true
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode run --model opencode/muse-spark-1.3-contributor-free "Follow AGENTS.md (E2E bot identity) and execute the E2E suite against http://localhost:3000. Write the verdict to /tmp/e2e-result.md."

      - name: Post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          if [ "${{ steps.e2e.outcome }}" = "success" ] && [ -f /tmp/e2e-result.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/e2e-result.md
          else
            {
              echo "E2E FAIL $SHA"
              echo ""
              if [ -f /tmp/e2e-result.md ]; then cat /tmp/e2e-result.md; else echo "No result file — the E2E run did not complete. Check the workflow logs."; fi
            } > /tmp/e2e-fail.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/e2e-fail.md
            exit 1
          fi

      - name: Restore AGENTS.md (never leak the swap into the PR diff)
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then kill "$(cat /tmp/dev.pid)" || true; fi
          cp /tmp/AGENTS.orig.md AGENTS.md
          git diff --exit-code -- AGENTS.md && echo "AGENTS.md restored clean"
