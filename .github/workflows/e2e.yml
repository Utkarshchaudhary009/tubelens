name: e2e

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Find PR for branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(gh pr list --head "${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUMBER" ]; then
            echo "Found open PR #$PR_NUMBER for $GITHUB_REF_NAME"
          else
            echo "No open PR found for $GITHUB_REF_NAME. E2E will still run; there is nowhere to post a PR review."
          fi

      - name: Install OpenCode
        run: |
          for i in 1 2 3; do
            if curl -fsSL https://opencode.ai/install | bash; then
              break
            fi
            echo "OpenCode install attempt $i failed; retrying..."
            sleep 10
            if [ "$i" = 3 ]; then
              echo "OpenCode install failed after 3 attempts."
              exit 1
            fi
          done

      - name: Give E2E agent full machine access
        run: |
          cat > /tmp/opencode-e2e.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": "allow"
          }
          EOF

      - name: Use E2E agent instructions
        run: cp AGENTS.md /tmp/AGENTS.orig.md && cp AGENTS.E2E.md AGENTS.md

      - name: Run E2E agent
        id: e2e
        env:
          OPENCODE_CONFIG: /tmp/opencode-e2e.json
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          set -o pipefail
          opencode run --model opencode/muse-spark-1.3-contributor-free "Read AGENTS.md and perform the E2E review for the current branch push. Inspect the diff against its base branch, start the application yourself, start any supporting services you need, test the APIs and user flows relevant to the changes, investigate failures, and return the final E2E report." \
            | tee /tmp/e2e-result.md

      - name: Post review to PR
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/e2e-result.md ]; then
            gh pr review "${{ steps.pr.outputs.number }}" --comment --body-file /tmp/e2e-result.md
          else
            gh pr review "${{ steps.pr.outputs.number }}" --comment --body "E2E agent did not produce a report. Check the workflow logs."
          fi

      - name: Restore AGENTS.md
        if: always()
        run: |
          if [ -f /tmp/AGENTS.orig.md ]; then
            cp /tmp/AGENTS.orig.md AGENTS.md
            git diff --exit-code -- AGENTS.md
          else
            echo "No AGENTS.md backup found at /tmp/AGENTS.orig.md; skipping restore."
          fi

      - name: Fail when the E2E agent changed the repository
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "E2E agent left repository changes behind:"
            git status --short
            exit 1
          fi
