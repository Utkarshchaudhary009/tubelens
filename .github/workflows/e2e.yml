name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Give E2E agent full machine access
        run: |
          cat > /tmp/opencode-e2e.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": "allow"
          }
          EOF

      - name: Use E2E agent instructions
        run: cp AGENTS.md /tmp/AGENTS.orig.md && cp AGENTS.E2E.md AGENTS.md

      - name: Run E2E agent
        id: e2e
        env:
          OPENCODE_CONFIG: /tmp/opencode-e2e.json
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          set -o pipefail
          opencode run --model opencode/muse-spark-1.3-contributor-free "Read AGENTS.md and perform the E2E review for this PR. Inspect the diff, start the application yourself, start any supporting services you need, test the relevant APIs and flows, investigate failures, and return the final E2E report." \
            | tee /tmp/e2e-result.md

      - name: Post result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/e2e-result.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/e2e-result.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "E2E agent did not produce a report. Check the workflow logs."
          fi

      - name: Restore AGENTS.md
        if: always()
        run: |
          cp /tmp/AGENTS.orig.md AGENTS.md
          git diff --exit-code -- AGENTS.md

      - name: Fail when the E2E agent changed the repository
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "E2E agent left repository changes behind:"
            git status --short
            exit 1
          fi
