name: unit-test

on:
  push:
    branches:
      - '**'
  workflow_dispatch:


permissions:
  pull-requests: write

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 11: static secret scan ($0 grep — no external action, no token).
  # Mirrors SECRET_SCAN_PATTERNS in src/lib/redact.ts over shippable files
  # (unit-test fixtures carry intentionally fake secrets; the bun suite's
  # repo-wide scan covers those paths). Patterns use regex syntax rather
  # than example literals so this file never matches itself.
  secret-scan:
    # Least privilege: tokenless clone + grep need no token at all, so this
    # job takes none of the workflow-level pull-requests:write grant.
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (tokenless)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
          git fetch origin "$GITHUB_SHA" --depth 1
          git checkout "$GITHUB_SHA"

      - name: Static secret scan
        run: |
          set -u
          scan() {
            desc="$1"; pattern="$2"; hits=0
            # Per-file loop prints only file + line metadata, never matched
            # text — a detected leak must not itself leak into Actions logs.
            # NUL-delimited throughout so filenames with spaces survive;
            # xargs -r runs nothing on an empty list (grep would otherwise
            # read stdin and hang); `--` guards patterns starting with `-`.
            while IFS= read -r -d '' file; do
              matches="$(grep -nE -- "$pattern" "$file" 2>/dev/null || true)"
              [ -z "$matches" ] && continue
              # Drop documentation/placeholder lines (mirrors
              # isPlaceholderLine in src/lib/redact.ts).
              matches="$(printf '%s\n' "$matches" | grep -viE '<|YOUR_|\b(USER|PASSWORD|HOST|example)\b|changeme|placeholder|\.\.\.|\$\{\{|secrets\.|\$\{[A-Z_][A-Z0-9_]*(?::-[^}]*)?\}' || true)"
              # The unicode ellipsis cannot sit in the bracket above in some
              # locales, so filter it explicitly as well.
              matches="$(printf '%s\n' "$matches" | grep -v '…' || true)"
              [ -z "$matches" ] && continue
              lines="$(printf '%s\n' "$matches" | cut -d: -f1 | paste -sd' ' -)"
              echo "secret-scan HIT: $desc :: $file :: line(s) $lines"
              hits=$((hits + 1))
            done < <(git ls-files -z | grep -zv '__tests__' | grep -zv '\.test\.')
            if [ "$hits" -gt 0 ]; then
              echo "secret-scan FAIL: $desc ($hits file(s) with matches)"
              return 1
            fi
            echo "secret-scan OK: $desc"
          }
          scan 'credential database URL' 'postgres(ql)?://[^[:space:]'"'"'"]*:[^[:space:]'"'"'"]*@'
          scan 'stripe-shaped key' 'sk_(live|test)_[A-Za-z0-9]{6,}'
          scan 'machine key' '(^|[^A-Za-z0-9_-])ak_[A-Za-z0-9_-]{8,}'
          scan 'secret assignment' '(DATABASE_URL|DATABASE_DIRECT_URL|CLERK_SECRET_KEY|TUNNEL_UPDATE_TOKEN|BLOB_READ_WRITE_TOKEN|TUBELENS_AUDIO_SECRET|SUPADATA_API_KEY|DATADOG_API_KEY|DD_API_KEY)[[:space:]]*[:=][[:space:]]*['"'"'"]?[^[:space:]'"'"'";,]+'

      - name: Fixture detection self-check
        run: |
          set -u
          # Assemble a secret-shaped canary at runtime (no literal in this
          # file) and prove the stripe-shaped pattern catches it — a blind
          # scanner must fail the job instead of silently passing.
          CANARY="$(printf '%s_%s_%s' 'sk' 'live' 'CanaryDetector123456789')"
          if printf '%s\n' "$CANARY" | grep -qE 'sk_(live|test)_[A-Za-z0-9]{6,}'; then
            echo "secret-scan OK: fixture detection works"
          else
            echo "secret-scan FAIL: scanner blind to stripe-shaped fixture"
            exit 1
          fi

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (tokenless)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
          git fetch origin "$GITHUB_SHA" --depth 1
          git checkout "$GITHUB_SHA"

      - uses: oven-sh/setup-bun@v2

      - name: Find PR for branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          PR_NUMBER="$(gh pr list --head "${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Request CodeRabbit review
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: gh pr comment "${{ steps.pr.outputs.number }}" --body "@coderabbitai review"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: |
          if bun run lint > /tmp/unit-test-lint.log 2>&1; then
            code=0
          else
            code=$?
          fi
          cat /tmp/unit-test-lint.log
          exit $code

      - name: Typecheck
        run: |
          if bunx tsc --noEmit > /tmp/unit-test-tsc.log 2>&1; then
            code=0
          else
            code=$?
          fi
          cat /tmp/unit-test-tsc.log
          exit $code

      - name: Unit tests
        run: |
          if bun test > /tmp/unit-test-test.log 2>&1; then
            code=0
          else
            code=$?
          fi
          cat /tmp/unit-test-test.log
          exit $code

      - name: Build
        run: |
          if bun run build > /tmp/unit-test-build.log 2>&1; then
            code=0
          else
            code=$?
          fi
          cat /tmp/unit-test-build.log
          exit $code

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## unit-test summary'
            echo
            for step in lint tsc test build; do
              log="/tmp/unit-test-${step}.log"
              echo "### ${step}"
              echo
              if [ -f "$log" ]; then
                echo '```'
                cat "$log"
                echo '```'
              else
                echo 'Not run (an earlier step failed).'
              fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"