# remote-t3-watchdog — safety net that keeps one remote-t3 session alive.
#
# Runs every 30 min: if no remote-t3 run is in_progress/queued, dispatches a
# fresh one on main. Chained remote-t3 runs normally cover this themselves
# (each run self-chains at the end), so this only fires when a chain dies
# early (failed save step, expired PAT, workflow re-enabled after a stop).
#
# Needs the PAT secret (repo PAT with Actions read/write — same convention
# as remote-t3 and unit-test.yml): GITHUB_TOKEN cannot dispatch workflows,
# so without PAT this exits 0 (fail-open). An empty/gh-error list also
# exits 0 without dispatching, so API hiccups never cause dispatch storms.
name: remote-t3-watchdog

on: {}

# WORKFLOW TRIGGERS DISABLED: on:
#   schedule:
#     - cron: "*/30 * * * *"
#   workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch remote-t3 when idle
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PAT secret not set; skipping watchdog (fail-open)."
            exit 0
          fi
          LIVE="$(gh run list --workflow remote-t3.yml -R "${{ github.repository }}" --limit 10 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length' || echo ERROR)"
          if [ -z "$LIVE" ] || [ "$LIVE" = "ERROR" ]; then
            echo "remote-t3 status unknown; skipping dispatch (fail-open)."
            exit 0
          fi
          if [ "$LIVE" != "0" ]; then
            echo "remote-t3 already live/queued (${LIVE}); nothing to do."
            exit 0
          fi
          gh workflow run remote-t3.yml -R "${{ github.repository }}" --ref main
          echo "No live remote-t3 run; dispatched a fresh one."