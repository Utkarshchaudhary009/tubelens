name: docs-sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync-main
  cancel-in-progress: false

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Configure docs-only permissions
        run: |
          cat > /tmp/opencode-docs.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "read": "allow",
              "glob": "allow",
              "grep": "allow",
              "edit": {
                "*": "deny",
                "docs/**": "allow"
              },
              "bash": {
                "*": "deny",
                "pwd": "allow",
                "ls": "allow",
                "ls *": "allow",
                "git status": "allow",
                "git status *": "allow",
                "git diff": "allow",
                "git diff *": "allow",
                "git log": "allow",
                "git log *": "allow",
                "git show": "allow",
                "git show *": "allow",
                "git rev-parse": "allow",
                "git rev-parse *": "allow",
                "grep *": "allow"
              },
              "task": "deny"
            }
          }
          EOF

      - name: Use docs agent instructions
        run: cp AGENTS.md /tmp/AGENTS.orig.md && cp AGENTS.DOCS.md AGENTS.md

      - name: Run docs agent
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          set -o pipefail
          opencode run --model opencode/muse-spark-1.3-contributor-free "Read AGENTS.md and perform the documentation sync for the current main branch. Inspect the recent git history and diff yourself, understand what changed, update only docs/** when documentation needs to change, then return the final docs-sync report." \
            | tee /tmp/docs-result.md

      - name: Restore AGENTS.md
        if: always()
        run: cp /tmp/AGENTS.orig.md AGENTS.md

      - name: Ensure only docs changed
        if: always()
        run: |
          CHANGES="$(git status --porcelain | grep -vE '^[[:space:]]*[AM?]{1,2}[[:space:]]+docs/' || true)"
          if [ -n "$CHANGES" ]; then
            echo "Docs agent changed something outside docs/:"
            echo "$CHANGES"
            exit 1
          fi

      - name: Commit docs
        if: success()
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No documentation changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync documentation [skip docs-sync]"
            git push origin main
          fi

      - name: Publish docs summary
        if: always()
        run: |
          {
            echo '## Docs sync result'
            echo
            cat /tmp/docs-result.md 2>/dev/null || echo 'No docs report was produced. Check the workflow logs.'
          } >> "$GITHUB_STEP_SUMMARY"
