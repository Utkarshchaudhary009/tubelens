name: docs-sync

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync-main
  cancel-in-progress: false

jobs:
  docs-sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip check ([skip docs-sync] opt-out)
        id: skip
        run: |
          if git log -1 --pretty=%B | grep -qF "[skip docs-sync]"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.skip.outputs.run == 'true'

      - name: Capture merged PR diff
        if: steps.skip.outputs.run == 'true'
        run: |
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/merge.diff
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --name-only > /tmp/merge.files

      - name: Install OpenCode
        if: steps.skip.outputs.run == 'true'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Configure docs-only permissions
        if: steps.skip.outputs.run == 'true'
        run: |
          cat > /tmp/opencode-docs.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "read": "allow",
              "glob": "allow",
              "grep": "allow",
              "edit": {
                "*": "deny",
                "docs/**": "allow"
              },
              "bash": {
                "*": "deny",
                "pwd": "allow",
                "ls": "allow",
                "ls *": "allow",
                "git status": "allow",
                "git status *": "allow",
                "git diff": "allow",
                "git diff *": "allow",
                "git log": "allow",
                "git log *": "allow",
                "git show": "allow",
                "git show *": "allow",
                "git rev-parse": "allow",
                "git rev-parse *": "allow",
                "grep *": "allow"
              },
              "task": "deny"
            }
          }
          EOF

      - name: Use docs agent instructions
        if: steps.skip.outputs.run == 'true'
        run: cp AGENTS.md /tmp/AGENTS.orig.md && cp AGENTS.DOCS.md AGENTS.md

      - name: Run docs agent
        id: docs
        if: steps.skip.outputs.run == 'true'
        continue-on-error: true
        env:
          OPENCODE_CONFIG: /tmp/opencode-docs.json
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          set -o pipefail
          opencode run --model opencode/muse-spark-1.3-contributor-free "Read AGENTS.md and perform the documentation review for this merged PR. Inspect /tmp/merge.diff and the repository, update only docs/** when documentation needs to change, then return the final docs-sync report." \
            | tee /tmp/docs-result.md

      - name: Restore AGENTS.md
        if: always() && steps.skip.outputs.run == 'true'
        run: cp /tmp/AGENTS.orig.md AGENTS.md

      - name: Ensure only docs changed
        if: always() && steps.skip.outputs.run == 'true'
        run: |
          CHANGES="$(git status --porcelain | grep -vE '^[[:space:]]*[AM?]{1,2}[[:space:]]+docs/' || true)"
          if [ -n "$CHANGES" ]; then
            echo "Docs agent changed something outside docs/:"
            echo "$CHANGES"
            exit 1
          fi

      - name: Commit docs
        if: steps.skip.outputs.run == 'true'
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No documentation changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync after PR #${{ github.event.pull_request.number }} [skip docs-sync]"
            git push origin main
          fi

      - name: Post result to PR
        if: always() && steps.skip.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/docs-result.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/docs-result.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "Docs agent did not produce a report. Check the workflow logs."
          fi
