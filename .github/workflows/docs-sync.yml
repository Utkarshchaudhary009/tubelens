name: docs-sync

# Runs ONLY when a PR is merged to main (pull_request closed + merged==true).
# No push trigger — a push trigger would double-fire alongside this event.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync-main
  cancel-in-progress: false

jobs:
  docs-sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip check ([skip docs-sync] opt-out)
        id: skip
        run: |
          if git log -1 --pretty=%B | grep -qF "[skip docs-sync]"; then
            echo "Opt-out marker found — skipping docs sync."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.skip.outputs.run == 'true'

      - name: Install deps
        if: steps.skip.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Capture merge diff (base...head from event)
        if: steps.skip.outputs.run == 'true'
        run: |
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --name-only > /tmp/merge.files
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/merge.diff
          cat /tmp/merge.files

      - name: Install opencode
        if: steps.skip.outputs.run == 'true'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Swap AGENTS.md identity
        if: steps.skip.outputs.run == 'true'
        run: cp AGENTS.md /tmp/AGENTS.orig.md && cp AGENTS.DOCS.md AGENTS.md

      - name: Run docs bot (non-interactive, no TUI)
        id: docs
        if: steps.skip.outputs.run == 'true'
        continue-on-error: true
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode run --model opencode/muse-spark-1.3-contributor-free "Follow AGENTS.md (merge docs bot identity). Sync public developer docs from ONLY /tmp/merge.diff and /tmp/merge.files: update docs/**/*.mdx, **/openapi.json, and CHANGELOG.md. Never touch plans/** (owner-only, main agent only). Append the one-line result to /tmp/docs-result.md."

      - name: Restore AGENTS.md (never leak the swap)
        if: always() && steps.skip.outputs.run == 'true'
        run: |
          cp /tmp/AGENTS.orig.md AGENTS.md
          diff -q /tmp/AGENTS.orig.md AGENTS.md && git diff --exit-code -- AGENTS.md && echo "AGENTS.md restored clean"

      - name: Enforce docs-only changes (fail on src/workflow edits)
        if: steps.skip.outputs.run == 'true'
        run: |
          FORBIDDEN="$(git status --porcelain | grep -E '(^|[[:space:]])(src/|plans/|package\.json|package-lock\.json|bun\.lock|\.github/)' || true)"
          if [ -n "$FORBIDDEN" ]; then
            echo "Docs bot touched forbidden paths:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Docs-only boundary clean."

      - name: Commit docs back to main
        if: steps.skip.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          PR="#${{ github.event.pull_request.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs openapi.json '**/openapi.json' CHANGELOG.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No docs changes to commit."
            echo "DOCS SYNC $SHA: none — diff required no doc updates." > /tmp/docs-result.md
          else
            git commit -m "docs: sync on merge $PR [skip docs-sync]"
            git push origin main
          fi

      - name: Post summary comment
        if: always() && steps.skip.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/docs-result.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/docs-result.md
          else
            echo "DOCS SYNC $(git rev-parse --short HEAD): no result file — check workflow logs." > /tmp/docs-fallback.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/docs-fallback.md
          fi
