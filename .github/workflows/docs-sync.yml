name: docs-sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync-main
  cancel-in-progress: false

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Skip self-generated docs commit
        id: skip
        run: |
          if git log -1 --pretty=%B | grep -qF "[skip docs-sync]"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.skip.outputs.run == 'true'

      - name: Capture changes introduced by this main push
        if: steps.skip.outputs.run == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --root --no-commit-id --name-only -r "$AFTER_SHA" > /tmp/main.files
            git show --format= --no-ext-diff "$AFTER_SHA" > /tmp/main.diff
          else
            git diff "$BEFORE_SHA...$AFTER_SHA" > /tmp/main.diff
            git diff "$BEFORE_SHA...$AFTER_SHA" --name-only > /tmp/main.files
          fi

      - name: Install OpenCode
        if: steps.skip.outputs.run == 'true'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Configure docs-only permissions
        if: steps.skip.outputs.run == 'true'
        run: |
          cat > /tmp/opencode-docs.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "read": "allow",
              "glob": "allow",
              "grep": "allow",
              "edit": {
                "*": "deny",
                "docs/**": "allow"
              },
              "bash": {
                "*": "deny",
                "pwd": "allow",
                "ls": "allow",
                "ls *": "allow",
                "git status": "allow",
                "git status *": "allow",
                "git diff": "allow",
                "git diff *": "allow",
                "git log": "allow",
                "git log *": "allow",
                "git show": "allow",
                "git show *": "allow",
                "git rev-parse": "allow",
                "git rev-parse *": "allow",
                "grep *": "allow"
              },
              "task": "deny"
            }
          }
          EOF

      - name: Use docs agent instructions
        if: steps.skip.outputs.run == 'true'
        run: cp AGENTS.md /tmp/AGENTS.orig.md && cp AGENTS.DOCS.md AGENTS.md

      - name: Run docs agent
        if: steps.skip.outputs.run == 'true'
        id: docs
        env:
          OPENCODE_CONFIG: /tmp/opencode-docs.json
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          set -o pipefail
          opencode run --model opencode/muse-spark-1.3-contributor-free "Read AGENTS.md and perform the documentation sync for the latest push to main. Inspect /tmp/main.diff and /tmp/main.files to understand what changed, update only docs/** when public documentation needs to change, then return the final docs-sync report." \
            | tee /tmp/docs-result.md

      - name: Publish docs-sync summary
        if: always() && steps.skip.outputs.run == 'true'
        run: |
          {
            echo '## Docs sync result'
            echo
            cat /tmp/docs-result.md 2>/dev/null || echo 'No docs-sync report was produced. Check the workflow logs.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore AGENTS.md
        if: always() && steps.skip.outputs.run == 'true'
        run: cp /tmp/AGENTS.orig.md AGENTS.md

      - name: Ensure only docs changed
        if: always() && steps.skip.outputs.run == 'true'
        run: |
          CHANGES="$(git status --porcelain | grep -vE '^[[:space:]]*[AM?]{1,2}[[:space:]]+docs/' || true)"
          if [ -n "$CHANGES" ]; then
            echo "Docs agent changed something outside docs/:"
            echo "$CHANGES"
            exit 1
          fi

      - name: Commit docs
        if: steps.skip.outputs.run == 'true'
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No documentation changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync after main push [skip docs-sync]"
            git push origin main
          fi
