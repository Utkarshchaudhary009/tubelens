name: phase-runner

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: phase-runner-main
  cancel-in-progress: false

jobs:
  advance-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PAT }}

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run phase runner
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          set -o pipefail
          opencode run --agent phase-runner --auto --model opencode/muse-spark-1.3-contributor-free "Advance the next phase." \
            | tee /tmp/phase-result.md

      - name: Publish run result
        if: always()
        run: |
          {
            echo '## Phase runner result'
            echo
            cat /tmp/phase-result.md 2>/dev/null || echo 'No agent report was produced. Check the workflow logs.'
          } >> "$GITHUB_STEP_SUMMARY"
